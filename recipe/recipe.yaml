context:
  version: "0.7.0rc0"

package:
  name: jupyter-ai-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-ai-tools/jupyter_ai_tools-${{ version }}.tar.gz
  sha256: 36f99e503851ad63ca86b52fb4f891c9d0bec794936a43f2aadcbbb78d579cda

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - jupyter_server >=1.6,<3
    - jupyter_ydoc
    # NOTE: upstream jupyter-ai-tools 0.7.0rc0 requires jupyterlab-ai-commands
    # >=0.4.0rc0, but that pre-release is not yet on conda-forge (the feedstock
    # rc branch is blocked on maintainer access). The specifier is dropped to
    # unblock this RC. See the follow-up issue to rebuild once it is available.
    - jupyterlab-ai-commands
    - jupyterlab-commands-toolkit
    - pycrdt

tests:
  - python:
      imports:
        - jupyter_ai_tools
      # pip_check disabled: the 0.7.0rc0 wheel metadata requires
      # jupyterlab-ai-commands>=0.4.0rc0, which is not yet on conda-forge, so
      # pip check would fail against the available 0.3.1. Re-enable on rebuild
      # once jupyterlab-ai-commands 0.4.0rc0 is available (see tracking issue).
      pip_check: false
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-ai-tools
  summary: "A suite of tools for AI agents in Jupyter"
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://jupyter-ai.readthedocs.io/
  repository: https://github.com/jupyter-ai-contrib/jupyter-ai-tools

extra:
  recipe-maintainers:
    - jtpio
    - dlqqq
    - andrii-i
