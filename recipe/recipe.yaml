context:
  version: "0.8.0"

package:
  name: jupyter-ai-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-ai-tools/jupyter_ai_tools-${{ version }}.tar.gz
  sha256: e5d5e11b9b75cad68036ce4dfb850f12b2912be964db0a042024818ac6f111b2

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - jupyter_server >=1.6,<3
    - jupyter_ydoc >=3.0.0
    - jupyterlab-ai-commands >=0.4.0
    - jupyterlab-commands-toolkit >=0.3.1
    - nbclient
    - pycrdt

tests:
  - python:
      imports:
        - jupyter_ai_tools
      pip_check: true
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-ai-tools
  summary: "A suite of tools for AI agents in Jupyter"
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://jupyter-ai.readthedocs.io/
  repository: https://github.com/jupyter-ai-contrib/jupyter-ai-tools

extra:
  recipe-maintainers:
    - jtpio
    - dlqqq
    - andrii-i
    - conda-forge/jupyter-ai
