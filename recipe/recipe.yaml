context:
  version: "0.7.0rc0"

package:
  name: jupyter-ai-tools
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-ai-tools/jupyter_ai_tools-${{ version }}.tar.gz
  sha256: 36f99e503851ad63ca86b52fb4f891c9d0bec794936a43f2aadcbbb78d579cda

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - jupyter_server >=1.6,<3
    - jupyter_ydoc
    - jupyterlab-ai-commands >=0.4.0rc0
    - jupyterlab-commands-toolkit
    - pycrdt

tests:
  - python:
      imports:
        - jupyter_ai_tools
      pip_check: true
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-ai-tools
  summary: "A suite of tools for AI agents in Jupyter"
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://jupyter-ai.readthedocs.io/
  repository: https://github.com/jupyter-ai-contrib/jupyter-ai-tools

extra:
  recipe-maintainers:
    - jtpio
    - dlqqq
    - andrii-i
